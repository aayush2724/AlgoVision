services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - ML_SERVICE_URL=http://ml-service:8500
      - BACKEND_CORS_ORIGINS=http://localhost:8080,http://localhost:5500
    depends_on:
      - ml-service

  ml-service:
    build: ./ml-service
    # Internal only — reachable from the backend on the compose network,
    # never published to the host.
    expose:
      - "8500"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro,z
    depends_on:
      - backend
