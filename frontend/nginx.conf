server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Self-hosted fonts never change without a rename; offline sample traces
    # change with the tracers, so they revalidate hourly.
    location /fonts/ {
        include /etc/nginx/av-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /offline/ {
        include /etc/nginx/av-headers.inc;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location / {
        include /etc/nginx/av-headers.inc;
        # Path-style deep links (/explore, /a2z) fall through to the shell;
        # the client-side router opens the right page.
        try_files $uri $uri/ /index.html;
        # Force revalidation so UI updates appear without hard refreshes.
        # ETags make unchanged files a cheap 304, so this costs nothing.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy API calls to the backend container so the dockerized
    # frontend runs fully live, not on the offline emulators.
    location /api/ {
        include /etc/nginx/av-headers.inc;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
