server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # Force revalidation so UI updates appear without hard refreshes.
        # ETags make unchanged files a cheap 304, so this costs nothing.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy API calls to the backend container so the dockerized
    # frontend runs fully live, not on the offline emulators.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
