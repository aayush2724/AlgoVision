# Render blueprint: the two Python services. The frontend is on Vercel, which
# rewrites /api/* here (see vercel.json), so the browser only ever talks to
# one origin and CORS never comes into it.
services:
  - type: web
    name: algovision-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health-root
    # Render injects $PORT and expects the process to bind it; the Dockerfile's
    # hardcoded 8000 is only right for compose.
    # --proxy-headers / --forwarded-allow-ips: traffic arrives through Render's
    # proxy (and, for the browser, Vercel's rewrite before that), so without
    # trusting X-Forwarded-For every visitor shares the proxy's address and
    # the per-IP rate limits become one global bucket. The container is only
    # reachable through Render's proxy, so trusting the header is safe here.
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: ENV
        value: prod
      - key: BACKEND_CORS_ORIGINS
        sync: false          # set to your Vercel origin once it exists
      # `host` is a bare hostname with no scheme; the backend normalises it
      # (see config.ml_service_url) rather than us hardcoding the URL here.
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: algovision-ml
          property: host
      - key: INTERNAL_TOKEN
        generateValue: true  # Render generates it and shares it below

  - type: web
    name: algovision-ml
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    plan: free
    healthCheckPath: /health
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      # Must match algovision-api's value — with a token configured it is the
      # ONLY thing that authorises a caller (the private-IP allowlist is off),
      # because the address the service sees is Render's proxy, not the peer.
      - key: INTERNAL_TOKEN
        fromService:
          type: web
          name: algovision-api
          envVarKey: INTERNAL_TOKEN
      # Set whichever provider you use. Without one the service still runs and
      # the backend falls back to offline narration.
      - key: GROQ_API_KEY
        sync: false
